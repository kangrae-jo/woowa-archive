plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    '02-minimal-db-polling/src/main/java',
                    '04-reliability-hardening/src/main/java'
            ]
        }
        resources {
            srcDirs = [
                    'src/main/resources',
                    '02-minimal-db-polling/src/main/resources',
                    '04-reliability-hardening/src/main/resources'
            ]
        }
    }
    test {
        java {
            srcDirs = [
                    'src/test/java',
                    '02-minimal-db-polling/src/test/java',
                    '03-failure-reproduction/src/test/java',
                    '04-reliability-hardening/src/test/java'
            ]
        }
        resources {
            srcDirs = [
                    'src/test/resources',
                    '02-minimal-db-polling/src/test/resources',
                    '03-failure-reproduction/src/test/resources',
                    '04-reliability-hardening/src/test/resources'
            ]
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java21Launcher
}

springBoot {
    mainClass = 'com.kng0501.dbpolling.server.WebServerApplication'
}

tasks.register('run02WebServer', JavaExec) {
    group = 'application'
    description = '02단계 웹 서버를 별도 JVM으로 실행합니다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kng0501.dbpolling.server.WebServerApplication'
}

tasks.register('run02ImageWorker', JavaExec) {
    group = 'application'
    description = '02단계 이미지 워커를 별도 JVM으로 실행합니다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kng0501.dbpolling.worker.ImageWorkerApplication'
}

tasks.register('run04WebServer', JavaExec) {
    group = 'application'
    description = '04단계 웹 서버를 별도 JVM으로 실행합니다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kng0501.dbqueue.server.WebServerApplication'
}

tasks.register('run04ImageWorker', JavaExec) {
    group = 'application'
    description = '04단계 이미지 워커를 별도 JVM으로 실행합니다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kng0501.dbqueue.worker.ImageWorkerApplication'
}

test {
    useJUnitPlatform {
        excludeTags 'failure-reproduction'
    }
}

tasks.register('failureTest', Test) {
    group = 'verification'
    description = 'DB Polling의 알려진 실패 시나리오를 재현합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform {
        includeTags 'failure-reproduction'
    }
}
