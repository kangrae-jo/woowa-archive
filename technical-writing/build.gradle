plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    '02-minimal-db-polling/src/main/java',
                    '04-reliability-hardening/src/main/java'
            ]
        }
        resources {
            srcDirs = [
                    'src/main/resources',
                    '02-minimal-db-polling/src/main/resources',
                    '04-reliability-hardening/src/main/resources'
            ]
        }
    }
    test {
        java {
            srcDirs = [
                    'src/test/java',
                    '02-minimal-db-polling/src/test/java',
                    '03-failure-reproduction/src/test/java',
                    '04-reliability-hardening/src/test/java'
            ]
        }
        resources {
            srcDirs = [
                    'src/test/resources',
                    '02-minimal-db-polling/src/test/resources',
                    '03-failure-reproduction/src/test/resources',
                    '04-reliability-hardening/src/test/resources'
            ]
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        excludeTags 'failure-reproduction'
    }
}

tasks.register('failureTest', Test) {
    group = 'verification'
    description = 'DB Polling의 알려진 실패 시나리오를 재현합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform {
        includeTags 'failure-reproduction'
    }
}
