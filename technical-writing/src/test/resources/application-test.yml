spring:
  datasource:
    url: ${TECHNICAL_WRITING_TEST_DB_URL}
    username: ${TECHNICAL_WRITING_TEST_DB_USERNAME}
    password: ${TECHNICAL_WRITING_TEST_DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        generate_statistics: true

baseline:
  polling-interval: 10ms
  scheduling-enabled: false

db-queue:
  processing-timeout: 30s
  max-attempts: 3
  retry-delay: 1s
  concurrency: 2
  polling-interval: 10ms
  recovery-interval: 10ms
  scheduling-enabled: false
