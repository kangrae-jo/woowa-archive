plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'lv2/practice',
                    '../technical-writing/02-minimal-db-polling/src/main/java'
            ]
        }
        resources {
            srcDirs = ['../technical-writing/02-minimal-db-polling/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = [
                    '../technical-writing/02-minimal-db-polling/src/test/java',
                    '../technical-writing/03-failure-reproduction/src/test/java'
            ]
        }
        resources {
            srcDirs = [
                    '../technical-writing/02-minimal-db-polling/src/test/resources',
                    '../technical-writing/03-failure-reproduction/src/test/resources'
            ]
        }
    }
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.34.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:transcribe'
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:regions'
    implementation 'software.amazon.awssdk:sdk-core'

    implementation platform('org.springframework:spring-framework-bom:6.2.8')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'

    runtimeOnly 'com.h2database:h2:2.4.240'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        excludeTags 'failure-reproduction'
    }
}

tasks.register('failureTest', Test) {
    group = 'verification'
    description = 'DB Polling의 알려진 실패 시나리오를 재현합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform {
        includeTags 'failure-reproduction'
    }
}
